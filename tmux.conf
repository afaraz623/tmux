# set true-colour
set-option -sa terminal-features ',xterm-256color:RGB'

#turn on mouse support
set -g mouse on

# start windows and panes from 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# set prefix
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# set vim like yank and select
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# open panes in current directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# shift alt vim keys to swicth windows
bind -n M-H previous-window
bind -n M-L next-window

# kill pane without confirmation
bind-key x kill-pane

# change split windows keybinds
bind v split-window -v -c "#{pane_current_path}"
bind h split-window -h -c "#{pane_current_path}"

# plugin installs
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-yank'

run '~/.config/tmux/plugins/tpm/tpm'

# clone the tpm plugin first before reloading it using prefix+I
# git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm

### Navigation & Keybinding Reference ###

# --- Windows (like Vim tabs) ---
# prefix + c        → create new window
# prefix + ,        → rename window
# prefix + w        → list windows
# Alt+Shift+H       → previous window   (custom)
# Alt+Shift+L       → next window       (custom)

# --- Panes (splits) ---
# prefix + v        → vertical split in current dir (custom)
# prefix + h        → horizontal split in current dir (custom)

# Pane navigation (vim-tmux-navigator plugin)
# Ctrl + h          → move to left pane
# Ctrl + j          → move to pane below
# Ctrl + k          → move to pane above
# Ctrl + l          → move to right pane

# --- Copy mode ---
# prefix + [        → enter copy mode
# v                 → begin selection (custom vi-mode binding)
# Ctrl + v          → rectangle toggle (custom vi-mode binding)
# y                 → yank selection & exit copy mode (custom vi-mode binding)

# --- Misc ---
# prefix + x        → kill current pane (custom, no confirm)
# prefix + d        → detach from tmux
# prefix + ?        → show all key bindings

# --- TPM (plugin manager) ---
# prefix + I        → install plugins
# prefix + U        → update plugins
# prefix + Alt+u    → uninstall unused plugins
